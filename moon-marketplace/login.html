<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login - MOON Marketplace</title>
<link rel="stylesheet" href="assets/css/style.css"/>
<style>
.auth-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.auth-box {
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.02);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.auth-box h2 {
  margin: 0 0 8px 0;
  text-align: center;
}
.auth-box .subtitle {
  color: var(--moon-muted);
  text-align: center;
  margin-bottom: 24px;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--moon-muted);
}
.form-group input, .form-group select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.2);
  color: var(--moon-white);
  font-size: 14px;
}
.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: var(--moon-soft);
}
.btn-auth {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: var(--moon-soft);
  color: var(--moon-dark);
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
  transition: background 0.2s;
}
.btn-auth:hover {
  background: var(--moon-blue);
  color: var(--moon-white);
}
.auth-links {
  text-align: center;
  margin-top: 20px;
  color: var(--moon-muted);
}
.auth-links a {
  color: var(--moon-soft);
  text-decoration: none;
}
.auth-links a:hover {
  text-decoration: underline;
}
.error-msg {
  background: rgba(255,100,100,0.1);
  border: 1px solid rgba(255,100,100,0.3);
  color: #ff6b6b;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
}
.success-msg {
  background: rgba(100,255,100,0.1);
  border: 1px solid rgba(100,255,100,0.3);
  color: #6bff6b;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
}
.logo-link {
  display: block;
  text-align: center;
  color: inherit;
  text-decoration: none;
  margin-bottom: 20px;
}
.logo-link h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 2px;
}
</style>
</head>
<body>
  <main class="auth-container">
    <div class="auth-box">
      <a href="index.html" class="logo-link"><h1>🌙 MOON</h1></a>
      <h2>Masuk ke Akun</h2>
      <p class="subtitle">Selamat datang kembali!</p>
      
      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required />
        </div>
        
        <button type="submit" class="btn-auth">Login</button>
      </form>
      
      <div class="auth-links">
        <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
        <p style="margin-top:10px"><a href="index.html">← Kembali ke Beranda</a></p>
      </div>
    </div>
  </main>

<script src="assets/js/auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
  
  if (!username || !password) {
    errorMsg.textContent = 'Username dan password harus diisi!';
    errorMsg.style.display = 'block';
    return;
  }
  
  const result = loginUser(username, password);
  
  if (result.success) {
    successMsg.textContent = result.message;
    successMsg.style.display = 'block';
    
    setTimeout(() => {
      redirectToDashboard();
    }, 1000);
  } else {
    errorMsg.textContent = result.message;
    errorMsg.style.display = 'block';
  }
});

// Check if already logged in
document.addEventListener('DOMContentLoaded', () => {
  const user = getCurrentUser();
  if (user) {
    redirectToDashboard();
  }
});
</script>
</body>
</html>
