<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Keranjang - MOON Marketplace</title>
<link rel="stylesheet" href="assets/css/style.css"/>
<style>
.cart-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.cart-item {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 16px;
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  margin-bottom: 12px;
}
.cart-item img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 10px;
}
.cart-item-info {
  flex: 1;
}
.cart-item-title {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 4px;
}
.cart-item-seller {
  font-size: 12px;
  color: var(--moon-muted);
  margin-bottom: 8px;
}
.cart-item-price {
  color: var(--moon-soft);
  font-weight: 600;
}
.cart-item-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
}
.qty-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.qty-btn {
  width: 32px;
  height: 32px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: var(--moon-white);
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
}
.qty-btn:hover {
  background: var(--moon-soft);
  color: var(--moon-dark);
}
.qty-value {
  font-weight: 600;
  min-width: 30px;
  text-align: center;
}
.btn-remove {
  padding: 6px 12px;
  background: rgba(220,53,69,0.2);
  border: 1px solid rgba(220,53,69,0.3);
  color: #dc3545;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.btn-remove:hover {
  background: rgba(220,53,69,0.3);
}
.cart-summary {
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
}
.summary-row.total {
  border-top: 1px solid rgba(255,255,255,0.1);
  margin-top: 10px;
  padding-top: 16px;
  font-size: 20px;
  font-weight: 700;
}
.summary-row.total span:last-child {
  color: var(--moon-soft);
}
.btn-checkout {
  width: 100%;
  padding: 16px;
  background: var(--moon-soft);
  color: var(--moon-dark);
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
  transition: background 0.2s;
}
.btn-checkout:hover {
  background: var(--moon-blue);
  color: var(--moon-white);
}
.empty-cart {
  text-align: center;
  padding: 60px 20px;
}
.empty-cart .icon {
  font-size: 64px;
  margin-bottom: 16px;
}
.empty-cart h2 {
  margin-bottom: 10px;
}
.empty-cart p {
  color: var(--moon-muted);
  margin-bottom: 20px;
}
.btn-shop {
  display: inline-block;
  padding: 12px 24px;
  background: var(--moon-soft);
  color: var(--moon-dark);
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <a href="index.html" style="color:inherit;text-decoration:none"><h1>🌙 MOON</h1></a>
      </div>
      <div style="flex:1"></div>
      <a class="btn" href="index.html">Lanjut Belanja</a>
    </div>
  </header>

  <main class="cart-container">
    <div class="cart-header">
      <h2>🛒 Keranjang Belanja</h2>
      <span id="itemCount"></span>
    </div>
    
    <div id="cartContent">
      <!-- Will be populated by JS -->
    </div>
  </main>

<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderCartPage();
});

function renderCartPage() {
  const cart = getCart();
  const container = document.getElementById('cartContent');
  const itemCount = document.getElementById('itemCount');
  
  if (cart.length === 0) {
    itemCount.textContent = '';
    container.innerHTML = `
      <div class="empty-cart">
        <div class="icon">🛒</div>
        <h2>Keranjang Kosong</h2>
        <p>Belum ada produk di keranjang Anda</p>
        <a href="index.html" class="btn-shop">Mulai Belanja</a>
      </div>
    `;
    return;
  }
  
  const totalItems = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
  const totalPrice = cart.reduce((sum, item) => sum + (item.price * (item.qty || 1)), 0);
  
  itemCount.textContent = `${totalItems} item`;
  
  container.innerHTML = `
    <div class="cart-items">
      ${cart.map(item => `
        <div class="cart-item" data-id="${item.id}">
          <img src="${item.img}" alt="${item.title}" onerror="this.src='assets/img/products/default.jpg'" />
          <div class="cart-item-info">
            <div class="cart-item-title">${item.title}</div>
            <div class="cart-item-seller">🏪 ${item.sellerName || 'MOON Store'}</div>
            <div class="cart-item-price">${toIDR(item.price)}</div>
          </div>
          <div class="cart-item-actions">
            <div class="qty-controls">
              <button class="qty-btn" onclick="decreaseQty(${item.id})">-</button>
              <span class="qty-value">${item.qty || 1}</span>
              <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
            </div>
            <div style="font-weight:700;color:var(--moon-soft)">${toIDR(item.price * (item.qty || 1))}</div>
            <button class="btn-remove" onclick="removeItem(${item.id})">🗑️ Hapus</button>
          </div>
        </div>
      `).join('')}
    </div>
    
    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal (${totalItems} item)</span>
        <span>${toIDR(totalPrice)}</span>
      </div>
      <div class="summary-row">
        <span>Ongkos Kirim</span>
        <span style="color:#28a745">GRATIS</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>${toIDR(totalPrice)}</span>
      </div>
      <button class="btn-checkout" onclick="goToCheckout()">
        Checkout (${toIDR(totalPrice)})
      </button>
    </div>
  `;
}

function increaseQty(itemId) {
  const cart = getCart();
  const item = cart.find(i => i.id === itemId);
  if (item) {
    item.qty = (item.qty || 1) + 1;
    saveCart(cart);
    renderCartPage();
  }
}

function decreaseQty(itemId) {
  let cart = getCart();
  const item = cart.find(i => i.id === itemId);
  if (item) {
    item.qty = (item.qty || 1) - 1;
    if (item.qty <= 0) {
      cart = cart.filter(i => i.id !== itemId);
    }
    saveCart(cart);
    renderCartPage();
  }
}

function removeItem(itemId) {
  if (confirm('Hapus item ini dari keranjang?')) {
    let cart = getCart().filter(i => i.id !== itemId);
    saveCart(cart);
    renderCartPage();
  }
}

function goToCheckout() {
  const user = getCurrentUser();
  if (!user) {
    alert('Silakan login terlebih dahulu!');
    window.location.href = 'login.html';
    return;
  }
  if (user.role !== 'buyer') {
    alert('Hanya pembeli yang dapat melakukan checkout!');
    return;
  }
  window.location.href = 'checkout.html';
}
</script>
</body>
</html>
