<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pesanan Saya - MOON Marketplace</title>
<link rel="stylesheet" href="assets/css/style.css"/>
<style>
.orders-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.order-card {
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
}
.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: rgba(0,0,0,0.2);
}
.order-id {
  font-weight: 700;
}
.order-date {
  color: var(--moon-muted);
  font-size: 14px;
}
.order-body {
  padding: 20px;
}
.order-item {
  display: flex;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.order-item:last-child {
  border-bottom: none;
}
.order-item img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
}
.order-item-info {
  flex: 1;
}
.order-item-title {
  font-weight: 600;
  margin-bottom: 4px;
}
.order-item-seller {
  font-size: 12px;
  color: var(--moon-muted);
  margin-bottom: 4px;
}
.order-item-price {
  color: var(--moon-soft);
}
.order-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: rgba(0,0,0,0.1);
}
.order-total {
  font-size: 18px;
  font-weight: 700;
}
.order-total span {
  color: var(--moon-soft);
}
.badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.badge-pending {
  background: rgba(255,193,7,0.2);
  color: #ffc107;
}
.badge-processing {
  background: rgba(0,123,255,0.2);
  color: #007bff;
}
.badge-shipped {
  background: rgba(23,162,184,0.2);
  color: #17a2b8;
}
.badge-completed {
  background: rgba(40,167,69,0.2);
  color: #28a745;
}
.badge-paid {
  background: rgba(40,167,69,0.2);
  color: #28a745;
}
.badge-unpaid {
  background: rgba(220,53,69,0.2);
  color: #dc3545;
}
.status-badges {
  display: flex;
  gap: 8px;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
}
.empty-state .icon {
  font-size: 64px;
  margin-bottom: 16px;
}
.empty-state h2 {
  margin-bottom: 10px;
}
.empty-state p {
  color: var(--moon-muted);
  margin-bottom: 20px;
}
.btn-shop {
  display: inline-block;
  padding: 12px 24px;
  background: var(--moon-soft);
  color: var(--moon-dark);
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
}
.shipping-info {
  background: rgba(0,0,0,0.1);
  padding: 12px 16px;
  border-radius: 8px;
  margin-top: 12px;
  font-size: 14px;
}
.shipping-info strong {
  color: var(--moon-soft);
}
</style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <a href="index.html" style="color:inherit;text-decoration:none"><h1>🌙 MOON</h1></a>
      </div>
      <div style="flex:1"></div>
      <a class="btn" href="index.html">← Kembali ke Beranda</a>
    </div>
  </header>

  <main class="orders-container">
    <div class="page-header">
      <h2>📦 Pesanan Saya</h2>
    </div>
    
    <div id="ordersContent">
      <!-- Will be populated by JS -->
    </div>
  </main>

<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = getCurrentUser();
  
  if (!user) {
    alert('Silakan login terlebih dahulu!');
    window.location.href = 'login.html';
    return;
  }
  
  if (user.role !== 'buyer') {
    alert('Halaman ini hanya untuk pembeli!');
    window.location.href = 'index.html';
    return;
  }
  
  loadOrders(user.id);
});

function loadOrders(buyerId) {
  const orders = getOrdersByBuyer(buyerId);
  const container = document.getElementById('ordersContent');
  
  if (orders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <h2>Belum Ada Pesanan</h2>
        <p>Anda belum memiliki pesanan. Yuk mulai belanja!</p>
        <a href="index.html" class="btn-shop">Mulai Belanja</a>
      </div>
    `;
    return;
  }
  
  // Sort by newest first
  const sortedOrders = orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  
  container.innerHTML = sortedOrders.map(order => {
    const statusLabels = {
      'pending_payment': 'Menunggu Pembayaran',
      'processing': 'Diproses',
      'shipped': 'Dikirim',
      'completed': 'Selesai',
      'cancelled': 'Dibatalkan'
    };
    
    const statusClass = {
      'pending_payment': 'pending',
      'processing': 'processing',
      'shipped': 'shipped',
      'completed': 'completed',
      'cancelled': 'pending'
    };
    
    return `
      <div class="order-card">
        <div class="order-header">
          <div>
            <div class="order-id">Order #${order.id}</div>
            <div class="order-date">${formatDate(order.createdAt)}</div>
          </div>
          <div class="status-badges">
            <span class="badge badge-${order.paymentStatus === 'paid' ? 'paid' : 'unpaid'}">
              ${order.paymentStatus === 'paid' ? '✓ Dibayar' : 'Belum Dibayar'}
            </span>
            <span class="badge badge-${statusClass[order.status]}">
              ${statusLabels[order.status]}
            </span>
          </div>
        </div>
        
        <div class="order-body">
          ${order.items.map(item => `
            <div class="order-item">
              <img src="${item.img || 'assets/img/products/default.jpg'}" alt="${item.title}" onerror="this.src='assets/img/products/default.jpg'" />
              <div class="order-item-info">
                <div class="order-item-title">${item.title}</div>
                <div class="order-item-seller">🏪 ${item.sellerName || 'MOON Store'}</div>
                <div class="order-item-price">${toIDR(item.price)} x ${item.qty}</div>
              </div>
            </div>
          `).join('')}
          
          <div class="shipping-info">
            <strong>📍 Alamat Pengiriman:</strong><br>
            ${order.shipping.fullName} (${order.shipping.phone})<br>
            ${order.shipping.address}${order.shipping.postalCode ? ', ' + order.shipping.postalCode : ''}
            ${order.shipping.notes ? '<br><em>Catatan: ' + order.shipping.notes + '</em>' : ''}
          </div>
        </div>
        
        <div class="order-footer">
          <div class="order-total">
            Total: <span>${toIDR(order.total)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}
</script>
</body>
</html>
