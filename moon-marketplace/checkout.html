<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Checkout - MOON Marketplace</title>
<link rel="stylesheet" href="assets/css/style.css"/>
<style>
.checkout-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.checkout-grid {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 24px;
}
@media (max-width: 768px) {
  .checkout-grid {
    grid-template-columns: 1fr;
  }
}
.checkout-section {
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
.section-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--moon-muted);
}
.form-group input, .form-group textarea {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.2);
  color: var(--moon-white);
  font-size: 14px;
}
.form-row {
  display: flex;
  gap: 12px;
}
.form-row .form-group {
  flex: 1;
}
.cart-item {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.cart-item:last-child {
  border-bottom: none;
}
.cart-item img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 8px;
}
.cart-item-info {
  flex: 1;
}
.cart-item-title {
  font-weight: 600;
  margin-bottom: 4px;
}
.cart-item-seller {
  font-size: 12px;
  color: var(--moon-muted);
}
.cart-item-price {
  color: var(--moon-soft);
  font-weight: 600;
}
.payment-methods {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.payment-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.payment-option:hover {
  border-color: var(--moon-soft);
}
.payment-option.selected {
  border-color: var(--moon-soft);
  background: rgba(91,132,177,0.1);
}
.payment-option input {
  display: none;
}
.payment-option .icon {
  font-size: 24px;
}
.payment-option .name {
  font-weight: 600;
}
.payment-option .desc {
  font-size: 12px;
  color: var(--moon-muted);
}
.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
}
.summary-row.total {
  border-top: 1px solid rgba(255,255,255,0.1);
  margin-top: 10px;
  padding-top: 16px;
  font-size: 18px;
  font-weight: 700;
}
.btn-pay {
  width: 100%;
  padding: 16px;
  background: var(--moon-soft);
  color: var(--moon-dark);
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
  transition: background 0.2s;
}
.btn-pay:hover {
  background: var(--moon-blue);
  color: var(--moon-white);
}
.btn-pay:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.error-msg {
  background: rgba(255,100,100,0.1);
  border: 1px solid rgba(255,100,100,0.3);
  color: #ff6b6b;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
}
.empty-cart {
  text-align: center;
  padding: 60px 20px;
}
.empty-cart .icon {
  font-size: 64px;
  margin-bottom: 16px;
}
.empty-cart h2 {
  margin-bottom: 10px;
}
.empty-cart p {
  color: var(--moon-muted);
  margin-bottom: 20px;
}
.btn-back {
  display: inline-block;
  padding: 12px 24px;
  background: var(--moon-soft);
  color: var(--moon-dark);
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <a href="index.html" style="color:inherit;text-decoration:none"><h1>🌙 MOON</h1></a>
      </div>
      <div style="flex:1"></div>
      <a class="btn" href="cart.html">← Kembali ke Keranjang</a>
    </div>
  </header>

  <main class="checkout-container">
    <h2 style="margin-bottom:24px">Checkout</h2>
    
    <div id="checkoutContent">
      <!-- Will be populated by JS -->
    </div>
  </main>

<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
let currentUser = null;
let cartItems = [];

document.addEventListener('DOMContentLoaded', () => {
  currentUser = getCurrentUser();
  
  if (!currentUser) {
    alert('Silakan login terlebih dahulu!');
    window.location.href = 'login.html';
    return;
  }
  
  if (currentUser.role !== 'buyer') {
    alert('Hanya pembeli yang dapat melakukan checkout!');
    window.location.href = 'index.html';
    return;
  }
  
  cartItems = getCart();
  
  if (cartItems.length === 0) {
    showEmptyCart();
  } else {
    renderCheckout();
  }
});

function showEmptyCart() {
  document.getElementById('checkoutContent').innerHTML = `
    <div class="empty-cart">
      <div class="icon">🛒</div>
      <h2>Keranjang Kosong</h2>
      <p>Belum ada produk di keranjang Anda</p>
      <a href="index.html" class="btn-back">Mulai Belanja</a>
    </div>
  `;
}

function renderCheckout() {
  const total = cartItems.reduce((sum, item) => sum + (item.price * (item.qty || 1)), 0);
  
  document.getElementById('checkoutContent').innerHTML = `
    <div class="checkout-grid">
      <div class="checkout-left">
        <!-- Shipping Info -->
        <div class="checkout-section">
          <h3 class="section-title">📍 Informasi Pengiriman</h3>
          <div id="errorMsg" class="error-msg"></div>
          
          <div class="form-group">
            <label for="fullName">Nama Penerima</label>
            <input type="text" id="fullName" value="${currentUser.fullName || ''}" placeholder="Nama lengkap penerima" required />
          </div>
          
          <div class="form-group">
            <label for="phone">No. Telepon</label>
            <input type="tel" id="phone" value="${currentUser.phone || ''}" placeholder="08xxxxxxxxxx" required />
          </div>
          
          <div class="form-group">
            <label for="address">Alamat Lengkap</label>
            <textarea id="address" rows="3" placeholder="Alamat lengkap (termasuk RT/RW, kelurahan, kecamatan, kota)" required>${currentUser.address || ''}</textarea>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="postalCode">Kode Pos</label>
              <input type="text" id="postalCode" placeholder="12345" />
            </div>
            <div class="form-group">
              <label for="notes">Catatan (opsional)</label>
              <input type="text" id="notes" placeholder="Patokan, warna rumah, dll" />
            </div>
          </div>
        </div>
        
        <!-- Payment Method -->
        <div class="checkout-section">
          <h3 class="section-title">💳 Metode Pembayaran</h3>
          <div class="payment-methods">
            <label class="payment-option selected" data-method="bank_transfer">
              <input type="radio" name="payment" value="bank_transfer" checked />
              <div class="icon">🏦</div>
              <div>
                <div class="name">Transfer Bank</div>
                <div class="desc">BCA, Mandiri, BNI, BRI</div>
              </div>
            </label>
            
            <label class="payment-option" data-method="ewallet">
              <input type="radio" name="payment" value="ewallet" />
              <div class="icon">📱</div>
              <div>
                <div class="name">E-Wallet</div>
                <div class="desc">GoPay, OVO, Dana, ShopeePay</div>
              </div>
            </label>
            
            <label class="payment-option" data-method="cod">
              <input type="radio" name="payment" value="cod" />
              <div class="icon">💵</div>
              <div>
                <div class="name">Bayar di Tempat (COD)</div>
                <div class="desc">Bayar saat barang sampai</div>
              </div>
            </label>
          </div>
        </div>
      </div>
      
      <div class="checkout-right">
        <!-- Order Summary -->
        <div class="checkout-section" style="position:sticky;top:20px">
          <h3 class="section-title">🛒 Ringkasan Pesanan</h3>
          
          <div class="cart-items">
            ${cartItems.map(item => `
              <div class="cart-item">
                <img src="${item.img}" alt="${item.title}" onerror="this.src='assets/img/products/default.jpg'" />
                <div class="cart-item-info">
                  <div class="cart-item-title">${item.title}</div>
                  <div class="cart-item-seller">🏪 ${item.sellerName || 'MOON Store'}</div>
                  <div class="cart-item-price">${toIDR(item.price)} x ${item.qty || 1}</div>
                </div>
              </div>
            `).join('')}
          </div>
          
          <div style="margin-top:16px">
            <div class="summary-row">
              <span>Subtotal (${cartItems.reduce((s, i) => s + (i.qty || 1), 0)} item)</span>
              <span>${toIDR(total)}</span>
            </div>
            <div class="summary-row">
              <span>Ongkos Kirim</span>
              <span style="color:#28a745">GRATIS</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span style="color:var(--moon-soft)">${toIDR(total)}</span>
            </div>
          </div>
          
          <button class="btn-pay" onclick="processCheckout()">
            Bayar ${toIDR(total)}
          </button>
          
          <p style="text-align:center;margin-top:12px;font-size:12px;color:var(--moon-muted)">
            🔒 Pembayaran aman & terenkripsi
          </p>
        </div>
      </div>
    </div>
  `;
  
  // Payment method selection
  document.querySelectorAll('.payment-option').forEach(option => {
    option.addEventListener('click', () => {
      document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
      option.classList.add('selected');
      option.querySelector('input').checked = true;
    });
  });
}

function processCheckout() {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';
  
  // Validate form
  const fullName = document.getElementById('fullName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const postalCode = document.getElementById('postalCode').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  
  if (!fullName || !phone || !address) {
    errorMsg.textContent = 'Harap lengkapi nama, telepon, dan alamat!';
    errorMsg.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  
  // Create order
  const shippingInfo = {
    fullName,
    phone,
    address,
    postalCode,
    notes
  };
  
  const orderResult = createOrder(currentUser.id, cartItems, shippingInfo);
  
  if (!orderResult.success) {
    errorMsg.textContent = orderResult.message;
    errorMsg.style.display = 'block';
    return;
  }
  
  // Process payment
  const paymentResult = processPayment(orderResult.order.id, paymentMethod, currentUser.id);
  
  if (!paymentResult.success) {
    errorMsg.textContent = paymentResult.message;
    errorMsg.style.display = 'block';
    return;
  }
  
  // Clear cart
  localStorage.removeItem(CART_KEY);
  
  // Show success
  const paymentMethodNames = {
    'bank_transfer': 'Transfer Bank',
    'ewallet': 'E-Wallet',
    'cod': 'Bayar di Tempat'
  };
  
  alert(`✅ Pembayaran berhasil!\n\nOrder ID: #${orderResult.order.id}\nMetode: ${paymentMethodNames[paymentMethod]}\nTotal: ${toIDR(orderResult.order.total)}\n\nTerima kasih telah berbelanja di MOON!`);
  
  window.location.href = 'orders.html';
}
</script>
</body>
</html>
