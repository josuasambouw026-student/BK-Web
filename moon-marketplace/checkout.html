<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Checkout - MOON</title>
<link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
  <header class="navbar"><div class="nav-inner"><div class="brand"><a href="index.html" style="color:inherit;text-decoration:none"><h1>MOON</h1></a></div></div></header>

  <main class="container">
    <div class="checkout-box" style="max-width:720px;margin:20px auto;padding:20px;background:rgba(255,255,255,0.02);border-radius:10px">
      <h2>Checkout</h2>
      <p>Lengkapi informasi pengiriman</p>
      <input id="fullname" placeholder="Nama Lengkap" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);margin:8px 0;background:transparent;color:var(--moon-white)"/>
      <input id="address" placeholder="Alamat Lengkap" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);margin:8px 0;background:transparent;color:var(--moon-white)"/>
      <input id="phone" placeholder="No. HP" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);margin:8px 0;background:transparent;color:var(--moon-white)"/>
      <button class="payBtn" style="padding:12px;border-radius:8px;border:none;background:var(--moon-soft);color:var(--moon-dark);margin-top:10px">Bayar Sekarang</button>
    </div>
  </main>

<script src="assets/js/app.js"></script>
</body>
</html>
